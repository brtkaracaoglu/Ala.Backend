<!DOCTYPE html>
<html lang="tr" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title>{{MailTitle}}</title>

    <style>
        /* RESET VE TEMEL AYARLAR */
        html, body {
            margin: 0 auto !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F4F8FB;
        }

        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }

        div[style*="margin: 16px 0"] {
            margin: 0 !important;
        }

        table, td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
        }

        table {
            border-spacing: 0 !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }

        img {
            -ms-interpolation-mode: bicubic;
            display: block;
            border: 0;
        }

        a {
            text-decoration: none;
            color: #005596;
            transition: all 0.2s;
        }

            a:hover {
                text-decoration: underline;
                color: #003366;
            }

        /* BUTON STİLİ (Modern İstemciler İçin) */
        .button-primary {
            background-color: #005596;
            background-image: linear-gradient(90deg, #005596 0%, #78BE20 100%);
            color: #ffffff !important;
            display: inline-block;
            padding: 14px 30px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            text-decoration: none !important;
            box-shadow: 0 4px 15px rgba(0, 85, 150, 0.2);
        }
    </style>
</head>

<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #F4F8FB;">
    <center style="width: 100%; background-color: #F4F8FB;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F4F8FB;">
            <tr>
                <td align="center" valign="top" style="padding: 40px 10px;">

                    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e6e6e6; overflow: hidden;">

                        <tr>
                            <td height="8" style="background-color: #005596; font-size: 0; line-height: 0;">&nbsp;</td>
                        </tr>

                        <tr>
                            <td align="center" style="padding: 25px 0; background-color: #ffffff; border-bottom: 2px solid #f0f0f0;">
                                <a href="https://www.europowerenerji.com.tr" target="_blank" style="text-decoration:none;">
                                    <img src="{{Logo}}" width="220" alt="{{Mail_General_LogoAltName}}" style="display: block; border: 0; max-width: 100%; height: auto;">
                                </a>
                            </td>
                        </tr>

                        <tr>
                            <td align="left" style="padding: 10px 40px; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #333333;">
                                {{BODY_CONTENT}}
                            </td>
                        </tr>

                        <tr>
                            <td align="center" style="padding: 0;">
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                    <tr>
                                        <td style="border-top: 2px solid #f0f0f0; font-size: 0; line-height: 0;">&nbsp;</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr>
                            <td align="center" style="padding: 8px 30px; background-color: #ffffff;">
                                <p style="margin: 0 0 4px 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; color: #555555;">
                                    <a href="https://www.europowerenerji.com.tr" target="_blank" style="color: #555555; text-decoration: none;">{{Footer_InfoOne}} <!-- iş yeri adı--></a>
                                </p>
                                <p style="margin: 0 0 4px 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; line-height: 1.5; color: #999999;">
                                    {{Footer_InfoTwo}} <!-- adres -->
                                    <br>
                                </p>
                                <p style="margin: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; color: #cccccc;">
                                    © {{CurrentYear}} {{Footer_InfoThree}}<!--Tüm hakları saklıdır. Bu e-posta otomatik oluşturulmuştur, lütfen yanıtlamayınız.-->
                                </p>
                            </td>
                        </tr>
                        <tr>
                            <td height="8" style="background-color: #78BE20; font-size: 0; line-height: 0;">&nbsp;</td>
                        </tr>

                    </table>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
