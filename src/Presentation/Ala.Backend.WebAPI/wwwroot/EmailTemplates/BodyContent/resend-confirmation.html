<tr>
    <td align="center" style="padding:0 24px;">

        <p style="margin:0 0 15px;
                  font-family:'Segoe UI', Helvetica, Arial, sans-serif;
                  font-size:24px;
                  font-weight:600;
                  color:#003A66;">
            {{Mail_Title_ResendConfirmation}}
        </p>

        <p style="margin:0 0 30px;
                  font-family:'Segoe UI', Helvetica, Arial, sans-serif;
                  font-size:15px;
                  line-height:1.6;
                  color:#5F6C7B;">
            {{Mail_Greeting}} <strong>{{FullName}}</strong>,<br>
            {{Mail_Body_ResendConfirmation_Info}}
        </p>

    </td>
</tr>

<tr>
    <td align="center" style="padding:0 40px 30px;">

        <p style="margin:0 0 10px;
                  font-family:'Segoe UI', Helvetica, Arial, sans-serif;
                  font-size:13px;
                  color:#999999;
                  text-align:center;">
            {{Mail_Body_FallbackInfo}}
        </p>

        <table width="100%" cellpadding="0" cellspacing="0"
               style="background-color:#F8F9FA;
                      border:1px dashed #D1D5DB;
                      border-radius:6px;">
            <tr>
                <td style="padding:12px;
                           font-family:Consolas,'Courier New',monospace;
                           font-size:10px;
                           line-height:1.4;
                           color:#6B7280;
                           text-align:center;
                           word-break:break-all;">
                    <a href="{{Url}}" style="text-decoration:none; color:#6B7280;">
                        {{Url}}
                    </a>
                </td>
            </tr>
        </table>

    </td>
</tr>
